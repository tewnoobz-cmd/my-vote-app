<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - ผลโหวตเรียลไทม์</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: #f4f7fe; color: #2b3674; margin: 0; padding: 30px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .status-dot { height: 10px; width: 10px; background-color: #05cd99; border-radius: 50%; display: inline-block; margin-right: 5px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #e9edf7; font-size: 14px; }
        th { background-color: #f8f9ff; color: #a3aed0; }
        .badge { background: #e9f2ff; color: #4318ff; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📊 ผลโหวตเรียลไทม์ (Real-time Dashboard)</h1>
            <div><span class="status-dot"></span> เชื่อมต่อระบบเรียลไทม์แล้ว</div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>สรุปคะแนนรวม</h3>
                <p>หมายเลข 1: <strong id="score1" style="color:#4318ff;">0</strong> คะแนน</p>
                <p>หมายเลข 2: <strong id="score2" style="color:#ffb800;">0</strong> คะแนน</p>
            </div>
            <div class="card">
                <canvas id="voteChart" height="120"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>ประวัติการโหวตทั้งหมด</h2>
            <table>
                <thead>
                    <tr>
                        <th>เวลา</th>
                        <th>รหัสนักศึกษา</th>
                        <th>เบอร์โทรศัพท์</th>
                        <th>ผู้สมัคร</th>
                        <th>จำนวนเงิน</th>
                    </tr>
                </thead>
                <tbody id="logsTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();
        let voteChart;

        function initChart() {
            const ctx = document.getElementById('voteChart').getContext('2d');
            voteChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['ผู้สมัคร หมายเลข 1', 'ผู้สมัคร หมายเลข 2'],
                    datasets: [{
                        label: 'คะแนนโหวตทั้งหมด',
                        data: [0, 0],
                        backgroundColor: ['#4318ff', '#ffb800'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        socket.on('voteUpdate', (data) => {
            const score1 = data.scores[1] || 0;
            const score2 = data.scores[2] || 0;

            document.getElementById('score1').innerText = score1;
            document.getElementById('score2').innerText = score2;

            if (voteChart) {
                voteChart.data.datasets[0].data = [score1, score2];
                voteChart.update();
            }

            const tableBody = document.getElementById('logsTable');
            tableBody.innerHTML = '';
            
            data.logs.forEach(log => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${log.timestamp}</td>
                        <td><strong>${log.studentId}</strong></td>
                        <td>${log.phone}</td>
                        <td><span class="badge">หมายเลข ${log.candidateId}</span></td>
                        <td><strong style="color: #05cd99;">+${log.amount} ฿</strong></td>
                    </tr>
                `;
            });
        });

        initChart();
    </script>
</body>
</html>
