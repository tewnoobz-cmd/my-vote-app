<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - ผลโหวตเรียลไทม์</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: #f4f7fe; color: #2b3674; margin: 0; padding: 30px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .status-dot { height: 10px; width: 10px; background-color: #05cd99; border-radius: 50%; display: inline-block; margin-right: 5px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #e9edf7; font-size: 14px; }
        th { background-color: #f8f9ff; color: #a3aed0; }
        .badge { background: #e9f2ff; color: #4318ff; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
        .btn-approve { background: #05cd99; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-reject { background: #ee5d50; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-left: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📊 ผลโหวตเรียลไทม์ (Real-time Dashboard)</h1>
            <div><span class="status-dot"></span> เชื่อมต่อระบบเรียลไทม์แล้ว</div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>สรุปคะแนนรวมทั้งหมด</h3>
                <div id="summaryScores" style="max-height: 200px; overflow-y: auto;"></div>
            </div>
            <div class="card">
                <canvas id="voteChart" height="120"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>ประวัติการโหวตและการอนุมัติสลิป</h2>
            <table>
                <thead>
                    <tr>
                        <th>เวลา</th>
                        <th>ชื่อ - นามสกุล</th>
                        <th>รหัสนักศึกษา/ผู้ปกครอง</th>
                        <th>ผู้สมัคร</th>
                        <th>จำนวนเงิน</th>
                        <th>สลิป</th>
                        <th>สถานะ</th>
                        <th>การจัดการ</th>
                    </tr>
                </thead>
                <tbody id="logsTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();
        let voteChart;

        function initChart() {
            const ctx = document.getElementById('voteChart').getContext('2d');
            voteChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Array.from({length: 36}, (_, i) => `เบอร์ ${i + 1}`),
                    datasets: [{
                        label: 'คะแนนโหวตทั้งหมด',
                        data: Array(36).fill(0),
                        backgroundColor: '#4318ff',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        async function verifyVote(voteId, status) {
            try {
                const res = await fetch('/api/admin/verify-vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voteId, status })
                });
                const data = await res.json();
                if (!data.success) alert(data.message);
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการอัปเดตสถานะ');
            }
        }

        socket.on('voteUpdate', (data) => {
            const scores = data.scores || {};
            
            if (voteChart) {
                const chartData = [];
                for (let i = 1; i <= 36; i++) {
                    chartData.push(scores[i] || 0);
                }
                voteChart.data.datasets[0].data = chartData;
                voteChart.update();
            }

            const tableBody = document.getElementById('logsTable');
            tableBody.innerHTML = '';
            
            if (data.logs) {
                data.logs.forEach(log => {
                    const slipBtn = log.slipUrl 
                        ? `<a href="${log.slipUrl}" target="_blank" style="color:#4318ff;">ดูสลิป</a>` 
                        : '-';

                    const actionBtns = log.status === 'pending'
                        ? `<button class="btn-approve" onclick="verifyVote(${log.id}, 'approved')">อนุมัติ</button>
                           <button class="btn-reject" onclick="verifyVote(${log.id}, 'rejected')">ปฏิเสธ</button>`
                        : '-';

                    tableBody.innerHTML += `
                        <tr>
                            <td>${log.timestamp}</td>
                            <td><strong>${log.fullname || '-'}</strong></td>
                            <td>${log.studentId}</td>
                            <td><span class="badge">เบอร์ ${log.candidateId}</span></td>
                            <td><strong style="color: #05cd99;">+${log.amount} ฿</strong></td>
                            <td>${slipBtn}</td>
                            <td>${log.status}</td>
                            <td>${actionBtns}</td>
                        </tr>
                    `;
                });
            }
        });

        initChart();
    </script>
</body>
</html>
