<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลการโหวตเรียลไทม์</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 900px; width: 100%; text-align: center; }
        h1 { font-size: 2.2rem; margin-bottom: 8px; color: #38bdf8; }
        .subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 30px; }
        .status-badge { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 6px 16px; border-radius: 20px; display: inline-block; font-size: 14px; margin-bottom: 25px; }
        .status-dot { height: 8px; width: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .scores-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .score-val { font-size: 2.5rem; font-weight: 600; margin-top: 10px; }
        .c1 { color: #38bdf8; }
        .c2 { color: #f59e0b; }
        .chart-box { background: #1e293b; padding: 25px; border-radius: 16px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏆 สรุปผลการลงคะแนนโหวต</h1>
        <p class="subtitle">แสดงผลการลงคะแนนแบบเรียลไทม์ (Live Results)</p>
        
        <div class="status-badge"><span class="status-dot"></span> อัปเดตข้อมูลอัตโนมัติ</div>

        <div class="scores-grid">
            <div class="card">
                <h3>ผู้สมัคร หมายเลข 1</h3>
                <div class="score-val c1" id="score1">0</div>
                <div style="color: #94a3b8;">คะแนน</div>
            </div>
            <div class="card">
                <h3>ผู้สมัคร หมายเลข 2</h3>
                <div class="score-val c2" id="score2">0</div>
                <div style="color: #94a3b8;">คะแนน</div>
            </div>
        </div>

        <div class="chart-box">
            <canvas id="liveChart" height="120"></canvas>
        </div>
    </div>

    <script>
        const socket = io();
        let liveChart;

        function initChart() {
            const ctx = document.getElementById('liveChart').getContext('2d');
            liveChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['ผู้สมัคร หมายเลข 1', 'ผู้สมัคร หมายเลข 2'],
                    datasets: [{
                        label: 'คะแนนโหวตรวม',
                        data: [0, 0],
                        backgroundColor: ['#38bdf8', '#f59e0b'],
                        borderRadius: 10
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                        x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
                    }
                }
            });
        }

        socket.on('voteUpdate', (data) => {
            const score1 = data.scores[1] || 0;
            const score2 = data.scores[2] || 0;

            document.getElementById('score1').innerText = score1.toLocaleString();
            document.getElementById('score2').innerText = score2.toLocaleString();

            if (liveChart) {
                liveChart.data.datasets[0].data = [score1, score2];
                liveChart.update();
            }
        });

        initChart();
    </script>
</body>
</html>
